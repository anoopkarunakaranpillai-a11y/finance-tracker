name: Kerala PSC paper sync
on:
  schedule:
    - cron: "30 22 * * 0"   # Mondays 01:30 Kuwait time
  workflow_dispatch:
  push:
    paths: [".github/workflows/psc-sync.yml", "tools/psc/crawl.py"]
permissions:
  contents: write
concurrency: psc-sync
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Catalogue official papers and answer keys
        run: python3 tools/psc/crawl.py
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add psc && git commit -m "Kerala PSC catalogue sync" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
